<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Trenzinho</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8fd3ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trenzinho">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body class="in-menu">
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="top">
      <button id="homeBtn" class="btn small" aria-label="Trocar de trem">🏠</button>
      <div id="stars"><span>⭐</span><span id="starCount">0</span></div>
      <div class="top-right">
        <button id="dayBtn" class="btn small" aria-label="Dia ou noite">🌙</button>
        <button id="soundBtn" class="btn small" aria-label="Som">🔊</button>
        <button id="fsBtn" class="btn small" aria-label="Tela cheia">⛶</button>
      </div>
    </div>

    <button id="actionBtn" class="btn action hidden" aria-label="Carregar">
      <span class="box">📦</span><span class="arrow">⬆️</span><span class="lbl">Carregar</span>
    </button>

    <div id="bottom">
      <div class="side">
        <button id="hornBtn" class="btn big horn" aria-label="Buzina">📯</button>
        <button id="energyBtn" class="btn big energy" aria-label="Energia">
          <span id="energyIcon"></span>
          <span class="meter"><span class="fill"></span></span>
        </button>
      </div>
      <button id="goBtn" class="btn huge go" aria-label="Andar ou parar">
        <svg class="icon-go" viewBox="0 0 100 100"><path d="M34 22 L80 50 L34 78 Z" fill="#fff"/></svg>
        <svg class="icon-stop" viewBox="0 0 100 100"><rect x="28" y="28" width="44" height="44" rx="8" fill="#fff"/></svg>
      </button>
      <div class="side">
        <button id="speedBtn" class="btn big" aria-label="Velocidade">🐢</button>
        <button id="camBtn" class="btn big cam" aria-label="Câmera"><span class="camicon">🎥</span><span class="mode">🚂</span></button>
      </div>
    </div>
  </div>

  <div id="menu">
    <h1>🚂 Trenzinho</h1>
    <p>Escolha o seu trem!</p>
    <div class="cards">
      <button class="card" data-type="steam">
        <svg viewBox="0 0 220 130">
          <rect x="150" y="30" width="50" height="60" rx="4" fill="#d32f2f"/>
          <rect x="145" y="24" width="60" height="10" rx="3" fill="#212121"/>
          <rect x="160" y="40" width="28" height="22" rx="3" fill="#bbdefb"/>
          <rect x="50" y="48" width="104" height="42" rx="21" fill="#d32f2f"/>
          <rect x="72" y="46" width="8" height="46" fill="#ffc107"/>
          <rect x="108" y="46" width="8" height="46" fill="#ffc107"/>
          <rect x="62" y="16" width="18" height="34" fill="#212121"/>
          <rect x="56" y="12" width="30" height="8" rx="3" fill="#212121"/>
          <circle cx="112" cy="46" r="10" fill="#ffc107"/>
          <circle cx="42" cy="69" r="22" fill="#eceff1" stroke="#424242" stroke-width="5"/>
          <circle cx="35" cy="64" r="4" fill="#222"/><circle cx="49" cy="64" r="4" fill="#222"/>
          <path d="M33 74 Q42 82 51 74" stroke="#c62828" stroke-width="3" fill="none"/>
          <circle cx="75" cy="102" r="16" fill="#d32f2f" stroke="#212121" stroke-width="4"/>
          <circle cx="115" cy="102" r="16" fill="#d32f2f" stroke="#212121" stroke-width="4"/>
          <circle cx="170" cy="106" r="11" fill="#d32f2f" stroke="#212121" stroke-width="4"/>
          <rect x="70" y="99" width="50" height="6" fill="#b0bec5"/>
          <circle cx="40" cy="10" r="8" fill="#fff" opacity=".9"/><circle cx="26" cy="4" r="6" fill="#fff" opacity=".7"/>
        </svg>
        <span>Maria Fumaça</span>
      </button>
      <button class="card" data-type="electric">
        <svg viewBox="0 0 220 130">
          <line x1="10" y1="6" x2="210" y2="6" stroke="#444" stroke-width="2"/>
          <path d="M95 34 L110 10 L125 34" stroke="#455a64" stroke-width="4" fill="none"/>
          <rect x="92" y="8" width="36" height="5" fill="#455a64"/>
          <rect x="20" y="34" width="180" height="60" rx="24" fill="#2e9e4f"/>
          <rect x="20" y="74" width="180" height="10" fill="#ffd600"/>
          <rect x="60" y="44" width="24" height="18" rx="3" fill="#1a2a3a"/>
          <rect x="96" y="44" width="24" height="18" rx="3" fill="#1a2a3a"/>
          <rect x="132" y="44" width="24" height="18" rx="3" fill="#1a2a3a"/>
          <rect x="176" y="42" width="18" height="20" rx="4" fill="#1a2a3a"/>
          <circle cx="36" cy="62" r="13" fill="#eceff1"/>
          <circle cx="32" cy="59" r="3" fill="#222"/><circle cx="41" cy="59" r="3" fill="#222"/>
          <path d="M31 66 Q36 71 42 66" stroke="#c62828" stroke-width="2.5" fill="none"/>
          <rect x="24" y="94" width="172" height="8" fill="#263238"/>
          <circle cx="50" cy="108" r="10" fill="#37474f"/><circle cx="76" cy="108" r="10" fill="#37474f"/>
          <circle cx="144" cy="108" r="10" fill="#37474f"/><circle cx="170" cy="108" r="10" fill="#37474f"/>
          <path d="M112 16 l-6 10 h8 l-6 10" stroke="#ffd600" stroke-width="3" fill="none"/>
        </svg>
        <span>Trem Elétrico</span>
      </button>
      <button class="card" data-type="diesel">
        <svg viewBox="0 0 220 130">
          <rect x="70" y="46" width="130" height="46" rx="4" fill="#f57c00"/>
          <rect x="40" y="26" width="46" height="66" rx="4" fill="#f57c00"/>
          <rect x="36" y="20" width="54" height="9" rx="3" fill="#212121"/>
          <rect x="48" y="34" width="30" height="20" rx="3" fill="#1a2a3a"/>
          <rect x="12" y="56" width="32" height="36" rx="4" fill="#f57c00"/>
          <circle cx="28" cy="72" r="12" fill="#eceff1"/>
          <circle cx="24" cy="69" r="3" fill="#222"/><circle cx="33" cy="69" r="3" fill="#222"/>
          <path d="M23 76 Q28 81 34 76" stroke="#c62828" stroke-width="2.5" fill="none"/>
          <rect x="140" y="34" width="10" height="14" fill="#212121"/>
          <circle cx="146" cy="24" r="6" fill="#757575" opacity=".8"/><circle cx="156" cy="14" r="5" fill="#9e9e9e" opacity=".6"/>
          <rect x="100" y="56" width="80" height="18" fill="#6d4c41" opacity=".5"/>
          <rect x="8" y="92" width="200" height="8" fill="#37474f"/>
          <circle cx="40" cy="108" r="10" fill="#37474f"/><circle cx="66" cy="108" r="10" fill="#37474f"/>
          <circle cx="150" cy="108" r="10" fill="#37474f"/><circle cx="176" cy="108" r="10" fill="#37474f"/>
        </svg>
        <span>Trem a Diesel</span>
      </button>
    </div>
  </div>

  <div id="confetti"></div>

  <noscript>Este jogo precisa de JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
